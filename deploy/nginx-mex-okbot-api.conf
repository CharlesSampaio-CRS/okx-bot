# Trecho para mex.app.br (MEX t4g, sites-enabled/mex-landing.conf)
# O HTML em /okbot/ chama /api/* na raiz. Sem estes location, o MEX Rust (:3002)
# responde 404 (ex.: tela Bot → GET /api/status).

    location ^~ /api/auth/ {
        proxy_pass http://18.204.179.51:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/$ /okbot/;
        proxy_redirect ~^https?://[^/]+/?$ /okbot/;
    }
    location ~ ^/api/(bots|config|keys|lab|settings|strategies|portfolio|fx|orders|instruments|candles|hunter|assistant|status|notifications|health)(/|$) {
        proxy_pass http://18.204.179.51:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }
    # /api/ restante continua no MEX (localhost:3002)
