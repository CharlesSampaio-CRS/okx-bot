server {
    listen 80 default_server;
    server_name _;

    # Static files servidos direto pelo nginx
    location /okbot/static/ {
        alias /home/ubuntu/okbot/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Compatibilidade: /static/ → /okbot/static/ (paths absolutos no HTML)
    location /static/ {
        alias /home/ubuntu/okbot/static/;
        expires 1d;
    }

    # Favicon
    location = /favicon.ico {
        alias /home/ubuntu/okbot/static/favicon.ico;
    }

    # API e app
    location /okbot/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # API direto na raiz (para que /api/auth/login funcione sem /okbot prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location = / { return 301 /okbot/; }
    location = /okbot { return 301 /okbot/; }
}
